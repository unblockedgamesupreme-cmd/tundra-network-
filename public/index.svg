<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#132247" />
      <stop offset="100%" stop-color="#070d1b" />
    </linearGradient>

    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .svg-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; fill: #ffffff; font-size: 38px; }
      .svg-subtitle { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 500; fill: #94a3b8; font-size: 18px; }
      .svg-badge { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; fill: #38bdf8; font-size: 14px; }
      .btn-text { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; fill: #000000; font-size: 16px; }
      .card-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 18px; }
      .card-sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 500; fill: #94a3b8; font-size: 13px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)" />

  <!-- Grid Lines / Tech Pattern -->
  <g stroke="rgba(56, 189, 248, 0.08)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="0" y1="700" x2="1200" y2="700" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="800" y1="0" x2="800" y2="800" />
    <line x1="1000" y1="0" x2="1000" y2="800" />
  </g>

  <!-- Glow Ambient Orbs -->
  <circle cx="200" cy="150" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="650" r="220" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Header Section -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="54" height="54" rx="14" fill="url(#cyanGradient)" filter="url(#glow)" />
    <text x="27" y="36" font-size="28" text-anchor="middle">❄️</text>
    <text x="74" y="38" class="svg-title">Tundra Network Games</text>
    <rect x="480" y="14" width="140" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="550" y="33" class="svg-badge" text-anchor="middle">JSDELIVR READY</text>
  </g>

  <!-- Hero Section -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="1080" height="180" rx="24" fill="rgba(19, 34, 71, 0.6)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
    <text x="40" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" fill="#ffffff" font-size="32">Unblocked Web Arcade Portal</text>
    <text x="40" y="96" class="svg-subtitle">Single-file executable SVG &amp; HTML standalone game launcher powered by jsDelivr CDN.</text>

    <!-- Launch CTA Button -->
    <a href="./singlefile/index.html" target="_top">
      <rect x="40" y="120" width="220" height="44" rx="22" fill="url(#cyanGradient)" filter="url(#glow)" cursor="pointer" />
      <text x="150" y="147" class="btn-text" text-anchor="middle" cursor="pointer">LAUNCH PORTAL 🚀</text>
    </a>
  </g>

  <!-- Featured Game Cards Grid -->
  <!-- Card 1: Super Smash Bros -->
  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="336" height="360" rx="20" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />
    <rect x="16" y="16" width="304" height="180" rx="12" fill="#1e293b" />
    <text x="168" y="110" font-size="48" text-anchor="middle">🎮</text>
    <text x="24" y="235" class="card-title">Super Smash Bros N64</text>
    <text x="24" y="260" class="card-sub">Nintendo 64 crossover fighting arena.</text>
    <rect x="24" y="300" width="80" height="24" rx="6" fill="rgba(56, 189, 248, 0.15)" />
    <text x="64" y="316" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="700" text-anchor="middle">ACTION</text>
    <text x="312" y="316" font-family="sans-serif" font-size="13" fill="#facc15" font-weight="700" text-anchor="end">★ 5.0</text>
  </g>

  <!-- Card 2: Crossy Road -->
  <g transform="translate(432, 380)">
    <rect x="0" y="0" width="336" height="360" rx="20" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />
    <rect x="16" y="16" width="304" height="180" rx="12" fill="#1e293b" />
    <text x="168" y="110" font-size="48" text-anchor="middle">🐔</text>
    <text x="24" y="235" class="card-title">Crossy Road 3D</text>
    <text x="24" y="260" class="card-sub">Infinite voxel traffic &amp; river crossing.</text>
    <rect x="24" y="300" width="80" height="24" rx="6" fill="rgba(16, 185, 129, 0.15)" />
    <text x="64" y="316" font-family="sans-serif" font-size="11" fill="#10b981" font-weight="700" text-anchor="middle">ARCADE</text>
    <text x="312" y="316" font-family="sans-serif" font-size="13" fill="#facc15" font-weight="700" text-anchor="end">★ 4.9</text>
  </g>

  <!-- Card 3: Final Fantasy NES -->
  <g transform="translate(804, 380)">
    <rect x="0" y="0" width="336" height="360" rx="20" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />
    <rect x="16" y="16" width="304" height="180" rx="12" fill="#1e293b" />
    <text x="168" y="110" font-size="48" text-anchor="middle">⚔️</text>
    <text x="24" y="235" class="card-title">Final Fantasy NES</text>
    <text x="24" y="260" class="card-sub">Legendary Warriors of Light quest.</text>
    <rect x="24" y="300" width="80" height="24" rx="6" fill="rgba(168, 85, 247, 0.15)" />
    <text x="64" y="316" font-family="sans-serif" font-size="11" fill="#a855f7" font-weight="700" text-anchor="middle">RPG</text>
    <text x="312" y="316" font-family="sans-serif" font-size="13" fill="#facc15" font-weight="700" text-anchor="end">★ 5.0</text>
  </g>

  <!-- Embedded ForeignObject Interactive HTML Container -->
  <foreignObject x="0" y="0" width="0" height="0">
    <div xmlns="http://www.w3.org/1999/xhtml"></div>
  </foreignObject>
</svg>
